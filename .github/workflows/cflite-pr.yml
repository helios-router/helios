# ClusterFuzzLite on pull requests: build the helios-ctl fuzz harnesses
# (tests/fuzz, .clusterfuzzlite/) and fuzz them briefly. A crash fails the job
# and the crashing input is kept as an artifact of the run.
name: Fuzzing (PR)
on:
  pull_request:
    paths:
      - pkgs/helios-ctl.py
      - pkgs/*.json
      - tests/fuzz/**
      - .clusterfuzzlite/**
      - .github/workflows/cflite-pr.yml
permissions: { contents: read }
concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite (code change)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read                  # fetch the latest batch corpus from earlier runs' artifacts
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          mode: code-change
          sanitizer: address
          fuzz-seconds: 300           # shared by all harnesses
          github-token: ${{ github.token }}
