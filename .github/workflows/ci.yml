name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix flake check --print-build-logs

  vm:
    name: VM tests (router, offline install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - run: nix build .#vmTests.router .#vmTests.hardening --print-build-logs --no-link
      - name: Offline install (helios-install in a VM with no network)
        run: nix build --impure .#vmTests.offline-install --print-build-logs --no-link

  tests:
    name: helios-ctl tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r tests/ci/requirements.txt
      - run: python tests/test_helios_ctl.py
      - run: shellcheck -s bash installer/helios-install.sh tests/*.sh pkgs/*.sh

  browsers:
    name: Photosphere in Firefox, WebKit, Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp tests/ci/package.json tests/ci/package-lock.json "$RUNNER_TEMP/pw/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/pw"
      - run: '"$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps firefox webkit chromium'
      - run: |
          tests/demo.sh 8765 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8765/photosphere/index.html >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browsers.cjs http://127.0.0.1:8765/photosphere/index.html shots firefox,webkit,chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: screenshots, path: shots }

  iso:
    name: installer ISO
    if: github.event_name != 'pull_request'
    needs: [nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix build --impure .#installer-iso --print-build-logs --out-link offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: helios-installer-iso, path: offline/iso/*.iso, retention-days: 14 }
