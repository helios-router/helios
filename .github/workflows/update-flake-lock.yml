# Weekly: bump nixpkgs (flake.lock) in a pull request, so CI proves an update
# builds and passes the tests before it lands. Merge it, and routers pick it up
# on their next `nix flake update helios`.
name: Update flake.lock
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: update nixpkgs"
          pr-labels: dependencies
          # PRs opened with the default token don't trigger CI. A fine-grained
          # token (contents + pull-requests: write, this repo only) fixes that.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
