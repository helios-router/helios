# Dependabot keeps the pinned GitHub Actions current (Nix inputs are updated by
# .github/workflows/update-flake-lock.yml; Dependabot has no Nix support).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }      # let a fresh release prove itself before we take it
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip             # tests/ci/requirements.txt (hash-pinned CI test deps)
    directory: /tests/ci
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm             # tests/ci/package-lock.json (Playwright for browser tests)
    directory: /tests/ci
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: pip             # tests/fuzz/requirements.txt (Atheris for local fuzzing)
    directory: /tests/fuzz
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker          # .clusterfuzzlite/Dockerfile (base image pinned by digest)
    directory: /.clusterfuzzlite
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
