<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How HeliOS applies a change">
  <title>How HeliOS applies a change</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f7fb; stroke: #c9d3e0; stroke-width: 1.5; }
    .key { fill: #fff6e0; stroke: #f2b233; stroke-width: 1.5; }
    .ok { fill: #e8f7ee; stroke: #47b06e; stroke-width: 1.5; }
    .t { fill: #10233a; font-size: 16px; font-weight: 700; }
    .s { fill: #3c4b5e; font-size: 13px; }
    .n { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .dot { fill: #1f8fe0; }
    .ar { stroke: #6a7a8e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 5 4; }
    .ah { fill: #6a7a8e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161d27; stroke: #34404f; }
      .key { fill: #2a2312; stroke: #b9862a; }
      .ok { fill: #122419; stroke: #3c8f5a; }
      .t { fill: #e6edf3; } .s { fill: #a9b6c4; }
      .ar { stroke: #8b98a8; } .ah { fill: #8b98a8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="420" rx="12"/>

  <!-- 1 You -->
  <rect class="box" x="20" y="40" width="190" height="110" rx="10"/>
  <circle class="dot" cx="44" cy="66" r="12"/><text class="n" x="44" y="71" text-anchor="middle">1</text>
  <text class="t" x="64" y="72">You</text>
  <text class="s" x="34" y="102">Change a setting in</text>
  <text class="s" x="34" y="120">Photosphere (web UI),</text>
  <text class="s" x="34" y="138">e.g. name a device</text>
  <path class="ar" d="M212 95 H246"/>

  <!-- 2 helios-ctl -->
  <rect class="box" x="250" y="40" width="190" height="110" rx="10"/>
  <circle class="dot" cx="274" cy="66" r="12"/><text class="n" x="274" y="71" text-anchor="middle">2</text>
  <text class="t" x="294" y="72">helios-ctl</text>
  <text class="s" x="264" y="102">Writes it into</text>
  <text class="s" x="264" y="120">state.json and marks</text>
  <text class="s" x="264" y="138">it as pending</text>
  <path class="ar" d="M442 95 H476"/>

  <!-- 3 Apply -->
  <rect class="box" x="480" y="40" width="200" height="110" rx="10"/>
  <circle class="dot" cx="504" cy="66" r="12"/><text class="n" x="504" y="71" text-anchor="middle">3</text>
  <text class="t" x="524" y="72">Apply</text>
  <text class="s" x="494" y="102">Commits to git and</text>
  <text class="s" x="494" y="120">rebuilds the whole</text>
  <text class="s" x="494" y="138">router from the files</text>
  <path class="ar" d="M682 95 H716"/>

  <!-- 4 Router -->
  <rect class="box" x="716" y="20" width="268" height="250" rx="10"/>
  <circle class="dot" cx="740" cy="46" r="12"/><text class="n" x="740" y="51" text-anchor="middle">4</text>
  <text class="t" x="760" y="52">The router runs it</text>
  <text class="s" x="732" y="82">• Heliopause: firewall</text>
  <text class="s" x="732" y="106">• Magnetosphere: DNS filter</text>
  <text class="s" x="732" y="130">• Galileo: DHCP and names</text>
  <text class="s" x="732" y="154">• Voyager: QoS and UPnP</text>
  <text class="s" x="732" y="178">• Heliosphere: remote access</text>
  <text class="s" x="732" y="202">• Solar Wind: notifications</text>
  <text class="s" x="732" y="226">• Hubble: monitoring</text>
  <text class="s" x="732" y="250">• Tailscale, printing, Log AI…</text>
  <path class="ar" d="M850 272 V302"/>

  <!-- 5 Confirm -->
  <rect class="ok" x="480" y="306" width="504" height="94" rx="10"/>
  <circle class="dot" cx="504" cy="332" r="12"/><text class="n" x="504" y="337" text-anchor="middle">5</text>
  <text class="t" x="524" y="338">Confirm within 2 minutes</text>
  <text class="s" x="494" y="366">Click Keep changes, or the router rolls back to the</text>
  <text class="s" x="494" y="386">last working version by itself (say, if it cut you off).</text>

  <!-- Your two files -->
  <rect class="key" x="20" y="200" width="420" height="200" rx="10"/>
  <text class="t" x="36" y="230">Your router is two files</text>
  <text class="s" x="36" y="250">in your private git repo (/etc/nixos)</text>
  <text class="t" x="36" y="286" font-size="14">site.nix</text>
  <text class="s" x="140" y="286">set once: router name, ports,</text>
  <text class="s" x="140" y="304">admin login, which features</text>
  <text class="t" x="36" y="340" font-size="14">state.json</text>
  <text class="s" x="140" y="340">changed in the web UI: networks,</text>
  <text class="s" x="140" y="358">devices, filtering, QoS, UPnP…</text>
  <text class="s" x="36" y="388">This repo holds only the generic parts.</text>

  <!-- arrows: helios-ctl writes state.json; Apply reads both files -->
  <path class="ar dash" d="M345 152 V196"/>
  <text class="s" x="354" y="182">writes</text>
  <path class="ar" d="M442 300 C 560 300, 580 230, 580 154"/>
  <text class="s" x="470" y="250">builds from</text>
</svg>
